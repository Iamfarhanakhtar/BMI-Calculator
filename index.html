<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>BMI Calculator</h1>
    <div class="box">
        <div class="container">
        <form>
        <p><label>Height in cm : </label><input type="text" id="height" placeholder="Enter height here"></p>
        <p><label>Weight in kg :</label> <input type="text" id="weight" placeholder="Enter weight here"></p>
        <button>Calculate</button>
        <div id="result"></div>
        <div id="weight-guide">
            <h3>BMI weight guide</h3>
            <p>Under Weight = Less than 18.6</p>
            <p>normal range = 18.6 and 24.9</p>
            <p>Overweight = 24.9 and 30</p>
            <p>Obese = Greater than 30</p>
        </div>
    </form>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
